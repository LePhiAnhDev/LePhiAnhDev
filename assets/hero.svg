<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 151" width="880" height="151" role="img" aria-label="Le Phi Anh">
<!--
  Hero wordmark, generated - do not hand-edit the path data.

  Every letter is an Inter outline (SIL OFL) converted to a path with
  fontTools, so the file needs no font at render time. That is the point of
  building it this way: camo will not load a webfont, and a system-font stack
  sets the same name at a different width on every machine, so a wordmark made
  of text elements is a wordmark that drifts. Outlines render identically
  everywhere.

  The name carries its own hierarchy instead of leaning on an added element:
  family and middle name in Regular at #787E88, given name in SemiBold at
  #2F81F7, 92px on 5.0 tracking. The rule underneath breaks at the same
  point the weight does, so the split is stated twice rather than decorated.

  The wordmark is the only thing in here. The profile column is about 293px on
  a phone, which scales this asset to a third of its size, so anything small
  enough to need reading is illegible at that width - the role line lives in
  the README as markdown, where it reflows and takes the theme's own text
  colour. A 92px wordmark survives the same scaling at roughly 31px.

  Transparent background, so one file serves both GitHub themes. No picture
  element pair: prefers-color-scheme follows the OS rather than GitHub's own
  theme toggle, and the two disagree often enough that near-white type goes
  invisible on the light theme. Both colours are set at display size, where AA
  wants 3:1. #2F81F7 clears it on #ffffff (3.5:1) and #0d1117 (5.6:1);
  #787E88 is the neutral with the highest achievable minimum across the two
  (4.1:1), so nothing here may be dimmer than it.

  There is no animation, and that is a finding rather than a preference. CSS
  animations do not advance inside an <img>-embedded SVG on this path: a probe
  rect carrying an infinite slide sat at its start offset in captures taken
  seconds apart. That alone would only cost the motion, but an applied
  animation also makes its own first keyframe the governing state, so a
  draw-in effect renders permanently blank rather than merely still - which is
  exactly how an earlier revision of this file lost the entire wordmark. SMIL
  is the technique that does work in an img (the typing header this replaced
  ran on it) and is the route to take if motion is wanted later.
-->
<title>Le Phi Anh</title>
<g transform="translate(161.25 99)">
<g fill="#787E88">
