<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 194" width="880" height="194" role="img" aria-label="Le Phi Anh">
<!--
  Hero plate, generated - do not hand-edit the path data.

  Every glyph is a JetBrains Mono outline (SIL OFL, v2.304) converted to a
  path with fontTools, so the file needs no font at render time: camo will not
  load a webfont and a font stack sets the same string at a different width on
  every machine. Windows' bundled Cascadia was rejected for this - it ships
  under Microsoft's own licence rather than the upstream OFL.

  The plate carries its own dark background on purpose. A transparent asset
  has to pick colours that work on #ffffff and #0d1117 at once; an opaque one
  sets its own contrast and renders identically under either GitHub theme. No
  prefers-color-scheme pair either: that follows the OS, not GitHub's theme
  toggle, and the two disagree often enough to make type disappear.

  Only display-size type is in here. The profile column is about 293px on a
  phone, which scales this plate to a third of its size: the 80px name lands
  near 27px and the 24px prompt near 8px. That is why the prompt is chrome
  and the role line lives in the README as markdown, where it reflows and
  takes the theme's own text colour.

  The cursor blinks on SMIL rather than CSS. CSS animation does not advance
  inside an img-embedded SVG on this path - a probe rect carrying an infinite
  slide sat at its start offset in captures taken seconds apart - and worse,
  an applied CSS animation makes its own first keyframe the governing state,
  so an element that starts hidden stays hidden. An earlier revision lost its
  entire wordmark that way. SMIL does run in an img (the typing header this
  replaced ran on it) and it animates away from the element's own attribute,
  so the cursor's resting state is lit: if SMIL is ever ignored it is simply
  a solid block.
-->
<title>Le Phi Anh</title>

