<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 130" width="880" height="130" role="img" aria-label="Le Phi Anh">
<!--
  Hero wordmark, generated - do not hand-edit the path data.

  Every letter is an Inter SemiBold outline (SIL OFL) converted to a path with
  fontTools, so the file needs no font at render time. That is deliberate:
  camo cannot load a webfont, and a system-font stack sets this name at a
  different width on every machine. Outlines render identically everywhere.
  Wordmark is 58px on 12.0 tracking, centred on a 880px box.

  The wordmark is the only thing in here. The profile column is about 293px on
  a phone, which scales this asset to a third of its size, so anything small
  enough to need reading is illegible at that width - the role line lives in
  the README as markdown, where it reflows and takes the theme's own text
  colour. A 58px wordmark survives the same scaling at roughly 19px.

  Transparent background, so one file serves both GitHub themes. No picture
  element pair: prefers-color-scheme follows the OS rather than GitHub's own
  theme toggle, and the two disagree often enough that near-white type goes
  invisible on the light theme. #2F81F7 at 58px clears AA-large on both
  #ffffff (3.5:1) and #0d1117 (5.6:1).

  There is no animation, and that is a finding rather than a preference. CSS
  animations do not advance inside an <img>-embedded SVG on this path: a
  probe rect carrying an infinite slide sat at its start offset in captures
  taken seconds apart. That alone would only cost the motion, but an applied
  animation also makes its own first keyframe the governing state, so a
  draw-in effect renders permanently blank rather than merely still - which
  is exactly how an earlier revision of this file lost the entire wordmark.
  Anything animated here has to survive its timeline never starting. SMIL is
  the technique that does work in an img (the typing header this replaced ran
  on it) and is the route to take if motion is wanted later.
-->
<title>Le Phi Anh</title>
